<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} · BountyDeck</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head><body>
<header><a href="{{ url_for('index') }}">BountyDeck</a>
{% if session.get('authenticated') %}<div class="top-actions"><span class="muted small">Authorized assessment workspace</span><a class="small" href="{{ url_for('update_page') }}">Updates</a><form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger">Sign out</button></form></div>{% endif %}</header>
<main class="wrap">
{% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}" role="status">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
<footer>BountyDeck {{ version[:8] }}</footer>
</body></html>
