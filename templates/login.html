{% extends "base.html" %}
{% block content %}
<section class="card login"><h1>Sign in</h1><p class="muted">Use the administrator password configured during setup.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">Password</label><input id="password" name="password" type="password" required autofocus><button>Sign in</button></form></section>
{% endblock %}
